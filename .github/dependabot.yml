version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      next-and-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: pip
    directory: /extractor
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /extractor
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
