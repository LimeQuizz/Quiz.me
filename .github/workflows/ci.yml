name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job needs secrets, so pull requests from forks run the full pipeline.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo .github/scripts/install-gitleaks.sh
      - run: gitleaks git --redact --verbose --exit-code 1 .

  web-lint:
    name: Web lint and typecheck
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-web-unit
          path: web/coverage/unit
          if-no-files-found: warn

  web-integration:
    name: Web integration tests (Testcontainers Postgres)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-web-integration
          path: web/coverage/integration
          if-no-files-found: warn

  extractor-lint:
    name: Extractor ruff and mypy --strict
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: extractor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: extractor/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  extractor-test:
    name: Extractor unit, fixture, and API tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: extractor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: extractor/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-extractor
          path: extractor/coverage.xml
          if-no-files-found: warn

  helm:
    name: Helm lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.19.0 }
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.0.1
      - run: helm lint deploy/helm/quizme -f deploy/helm/quizme/ci-values.yaml --strict
      - run: helm template ci deploy/helm/quizme -f deploy/helm/quizme/ci-values.yaml > /dev/null
      - run: helm unittest deploy/helm/quizme

  images:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [web, extractor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: quizme-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quizme-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - run: docker save quizme-${{ matrix.component }}:ci -o /tmp/quizme-${{ matrix.component }}.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: /tmp/quizme-${{ matrix.component }}.tar
          retention-days: 1

  e2e:
    name: Playwright e2e against built images
    needs: [images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - run: |
          docker load -i /tmp/images/quizme-web.tar
          docker load -i /tmp/images/quizme-extractor.tar
      - name: Generate throwaway credentials for this run
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_MIGRATOR_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "EXTRACTOR_SHARED_SECRET=$(openssl rand -hex 32)"
            echo "WEB_IMAGE=quizme-web:ci"
            echo "EXTRACTOR_IMAGE=quizme-extractor:ci"
          } > .env
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --no-build --wait --wait-timeout 180
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - name: Load test (rate limiting, load shedding, slowloris)
        run: node scripts/loadtest.mjs http://localhost:3000
        working-directory: web
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            compose-logs.txt
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
