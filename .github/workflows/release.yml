name: Release

# Publishes signed images (and, on version tags, the Helm chart) to GHCR.
# This workflow never deploys anything.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/limequizz/quizme

jobs:
  images:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [web, extractor]
    outputs:
      web-digest: ${{ steps.digest.outputs.web }}
      extractor-digest: ${{ steps.digest.outputs.extractor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance attestation generated by BuildKit and attached
          # to the image index.
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Generate SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach SBOM as a signed attestation
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "$IMAGE"
      - name: Sign the SLSA provenance as an attestation
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "$METADATA" | jq '."buildx.build.provenance" // {}' > provenance.json
          cosign attest --yes --type slsaprovenance --predicate provenance.json "$IMAGE"
      - id: digest
        run: echo "${{ matrix.component }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ env.IMAGE_PREFIX }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}"
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Publish Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.19.0 }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package chart with the release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/quizme --version "$VERSION" --app-version "$VERSION" -d dist
      - name: Push to ghcr.io/limequizz/charts and sign
        env:
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$HELM_PASSWORD" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="$(helm push "dist/quizme-${VERSION}.tgz" oci://ghcr.io/limequizz/charts 2>&1)"
          echo "$OUT"
          DIGEST="$(echo "$OUT" | awk '/Digest:/ {print $2}')"
          cosign sign --yes "ghcr.io/limequizz/charts/quizme@${DIGEST}"

  # Optional and off by default. An operator who wants their private deploy
  # repository to be notified sets the repository variable
  # DEPLOY_DISPATCH_REPO (owner/name) and the secret DEPLOY_DISPATCH_TOKEN
  # (a fine-grained PAT with Contents: read/write on that one repository).
  # Neither is configured in this public repository by default.
  notify-deploy:
    name: Notify operator deploy repository (optional)
    if: vars.DEPLOY_DISPATCH_REPO != '' && github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d "{\"event_type\":\"quizme-release\",\"client_payload\":{\"image_tag\":\"${GITHUB_SHA}\"}}"
