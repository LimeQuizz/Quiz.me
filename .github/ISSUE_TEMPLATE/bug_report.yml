name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.
        Do not attach files that contain personal or confidential information.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: e.g. 0.1.0 or a git sha
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Sign-in, Upload and extraction, Study modes, Deploy / Helm, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any personal data first.
      render: text
