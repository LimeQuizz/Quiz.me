suite: network policies
templates:
  - templates/networkpolicy.yaml
values:
  - ../ci-values.yaml
tests:
  - it: lets only web pods reach the extractor
    documentIndex: 0
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: web
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: extractor
  - it: denies extractor egress except DNS
    documentIndex: 1
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Egress]
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.egress[0].ports
          value:
            - { protocol: UDP, port: 53 }
            - { protocol: TCP, port: 53 }
  - it: renders nothing when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: adds the optional web policy
    set:
      networkPolicy.web.enabled: true
    asserts:
      - hasDocuments:
          count: 3
