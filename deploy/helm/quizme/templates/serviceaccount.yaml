{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quizme.serviceAccountName" . }}
  labels:
    {{- include "quizme.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither component talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
