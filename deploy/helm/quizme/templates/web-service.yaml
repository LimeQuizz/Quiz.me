apiVersion: v1
kind: Service
metadata:
  name: {{ include "quizme.fullname" . }}-web
  labels:
    {{- include "quizme.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "quizme.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
