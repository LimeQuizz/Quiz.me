{{- $s := .Values.secrets }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quizme.fullname" . }}-web
  labels:
    {{- include "quizme.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "quizme.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quizme.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "quizme.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "quizme.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "quizme.image" (dict "image" .Values.web.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- include "quizme.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_URL
              value: {{ required "web.publicUrl is required" .Values.web.publicUrl | quote }}
            - name: EXTRACTOR_URL
              value: {{ printf "http://%s-extractor:%v" (include "quizme.fullname" .) .Values.extractor.service.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.web.logLevel | quote }}
            - name: TRUSTED_PROXY_HOPS
              value: {{ .Values.web.trustedProxyHops | quote }}
            - name: UPLOAD_MAX_IN_FLIGHT
              value: {{ .Values.web.uploadMaxInFlight | quote }}
            - name: RUN_MIGRATIONS
              value: {{ .Values.web.runMigrations | quote }}
            {{- include "quizme.secretEnv" (dict "name" "DATABASE_URL" "path" "database" "secret" $s.database.existingSecret "key" $s.database.key) | nindent 12 }}
            {{- if $s.migrationDatabase.existingSecret }}
            {{- include "quizme.secretEnv" (dict "name" "MIGRATION_DATABASE_URL" "path" "migrationDatabase" "secret" $s.migrationDatabase.existingSecret "key" $s.migrationDatabase.key) | nindent 12 }}
            {{- end }}
            {{- include "quizme.secretEnv" (dict "name" "AUTH_SECRET" "path" "auth" "secret" $s.auth.existingSecret "key" $s.auth.key) | nindent 12 }}
            {{- include "quizme.secretEnv" (dict "name" "AUTH_GOOGLE_ID" "path" "google" "secret" $s.google.existingSecret "key" $s.google.clientIdKey) | nindent 12 }}
            {{- include "quizme.secretEnv" (dict "name" "AUTH_GOOGLE_SECRET" "path" "google" "secret" $s.google.existingSecret "key" $s.google.clientSecretKey) | nindent 12 }}
            {{- include "quizme.secretEnv" (dict "name" "AUTH_MICROSOFT_ENTRA_ID_ID" "path" "microsoft" "secret" $s.microsoft.existingSecret "key" $s.microsoft.clientIdKey) | nindent 12 }}
            {{- include "quizme.secretEnv" (dict "name" "AUTH_MICROSOFT_ENTRA_ID_SECRET" "path" "microsoft" "secret" $s.microsoft.existingSecret "key" $s.microsoft.clientSecretKey) | nindent 12 }}
            {{- include "quizme.secretEnv" (dict "name" "EXTRACTOR_SHARED_SECRET" "path" "extractor" "secret" $s.extractor.existingSecret "key" $s.extractor.key) | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
